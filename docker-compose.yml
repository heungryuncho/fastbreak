version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: fastbreak-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: fastbreak_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  redis:
    image: redis:7.2
    container_name: fastbreak-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql-data: